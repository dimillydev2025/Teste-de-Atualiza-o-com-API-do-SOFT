<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesso ao sistema Soft RH">
    <title>Login | Soft RH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --purple: #6a1b9a;
            --purple-dark: #4a148c;
            --purple-light: #8e24aa;
            --purple-pale: #f5effb;
            --white: #ffffff;
            --error: #c62828;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--purple-dark);
            background: linear-gradient(135deg, var(--purple-dark), var(--purple), var(--purple-light));
            font-family: 'Inter', sans-serif;
        }

        .login-shell {
            width: min(100%, 430px);
        }

        .login-card {
            padding: clamp(28px, 7vw, 48px);
            border-radius: var(--radius);
            background: var(--white);
            box-shadow: 0 24px 60px rgba(38, 8, 72, 0.28);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 34px;
            color: var(--purple);
            font-size: 1.25rem;
            font-weight: 700;
        }

        .brand-icon {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border-radius: 12px;
            color: var(--white);
            background: var(--purple);
        }

        h1 {
            margin-bottom: 8px;
            color: var(--purple-dark);
            font-size: clamp(1.7rem, 5vw, 2.1rem);
            line-height: 1.2;
        }

        .intro {
            margin-bottom: 28px;
            color: var(--purple-light);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--purple-dark);
            font-size: 0.875rem;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            top: 50%;
            left: 16px;
            color: var(--purple-light);
            transform: translateY(-50%);
        }

        input {
            width: 100%;
            min-height: 50px;
            padding: 0 16px 0 46px;
            border: 1px solid #ddc9eb;
            border-radius: 10px;
            outline: none;
            color: var(--purple-dark);
            background: var(--white);
            font: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.14);
        }

        .submit-button {
            width: 100%;
            min-height: 52px;
            margin-top: 8px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            color: var(--white);
            background: var(--purple);
            font: inherit;
            font-weight: 700;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .submit-button:hover {
            background: var(--purple-dark);
            transform: translateY(-1px);
        }

        .submit-button:focus-visible {
            outline: 3px solid var(--purple-light);
            outline-offset: 3px;
        }

        .error-message {
            min-height: 22px;
            margin-top: 14px;
            color: var(--error);
            font-size: 0.875rem;
            font-weight: 600;
            text-align: center;
        }

        @media (max-width: 420px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true"><i class="fas fa-users"></i></span>
                <span>Soft RH</span>
            </div>

            <h1 id="login-title">Acesse seu sistema</h1>
            <p class="intro">Entre com suas credenciais corporativas para continuar.</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">E-mail Corporativo</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email" autocomplete="username" placeholder="nome@empresa.com.br" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Digite sua senha" required>
                    </div>
                </div>

                <button class="submit-button" type="submit">Entrar no Sistema</button>
                <p class="error-message" id="errorMessage" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            if (email === 'admin@softrh.com.br' && senha === 'admin123') {
                localStorage.setItem('softrh_autenticado', 'true');
                localStorage.setItem('softrh_login_time', Date.now().toString());
                window.location.href = 'index.html';
                return;
            }

            errorMessage.textContent = 'E-mail ou senha inválidos.';
        });
    </script>
</body>
</html>
